services:
  postgres:
    image: postgres:16-alpine
    container_name: entity_management_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: entity_management_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entity_management_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8123,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: entity_management_db
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
